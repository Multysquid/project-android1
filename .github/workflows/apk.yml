# Builds the installable APK on every branch push. Pushes to main (and to the first PR
# branch, until it is merged) also replace the release "apk", so this link always points
# at the newest build:
# https://github.com/Multysquid/project-android1/releases/latest/download/einkaufsliste.apk
name: APK bauen

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Kernlogik testen
        run: ./gradlew -p core test 2>&1 | tee core.log

      - name: App testen und APK bauen
        run: ./gradlew :app:testReleaseUnitTest :app:assembleRelease 2>&1 | tee app.log

      # The errors go into a check run of their own, so they can be read on the PR's
      # checks page (and through the API) without downloading the whole log.
      - name: Build-Fehler melden
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            for f in core.log app.log; do
              [ -f "$f" ] || continue
              echo "== $f =="
              grep -E '^e: |^w: .*[Ee]rror|[Ee]rror:|ERROR|FAILED|\[ksp\]' "$f" | head -n 300 || true
              echo
              sed -n '/What went wrong/,/^\* Try:/p' "$f" | head -n 120 || true
              echo "-- letzte Zeilen von $f --"
              tail -n 60 "$f"
              echo
            done
          } > errors.txt
          head -c 60000 errors.txt > errors-short.txt
          {
            echo '```text'
            cat errors-short.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="Build-Fehler" \
            -f head_sha="$GITHUB_SHA" \
            -f status=completed \
            -f conclusion=failure \
            -f "output[title]=Build fehlgeschlagen" \
            -f "output[summary]=Auszug aus dem Gradle-Log von Lauf $GITHUB_RUN_NUMBER" \
            -F "output[text]=@errors-short.txt"

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk einkaufsliste.apk

      - uses: actions/upload-artifact@v4
        with:
          name: einkaufsliste-apk
          path: einkaufsliste.apk
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/einkaufsliste-app'
    runs-on: ubuntu-latest
    concurrency:
      group: apk-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: einkaufsliste-apk

      - name: Release "apk" ersetzen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="APK zum direkten Installieren auf Android 10 oder neuer.

          Auf dem Handy herunterladen, antippen und „Installieren“ wählen. Beim ersten Mal
          fragt Android, ob Installationen aus dieser Quelle erlaubt sind. Eine neue Version
          installiert sich über die alte, die Liste bleibt erhalten.

          Gebaut aus Commit ${GITHUB_SHA} (Branch ${GITHUB_REF_NAME}, Lauf ${GITHUB_RUN_NUMBER})."
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk einkaufsliste.apk \
            --target "$GITHUB_SHA" \
            --title "Einkaufsliste (Build ${GITHUB_RUN_NUMBER})" \
            --notes "$notes" \
            --latest
